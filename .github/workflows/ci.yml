name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

# Least privilege for GITHUB_TOKEN across every job (CodeQL actions/missing-workflow-permissions).
# All three jobs only read the repository — none comment, push, or publish — so
# read-only contents is sufficient. A job that needs more should declare its own
# narrower `permissions` block rather than widening this one.
permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # Worker deps (fastapi, redis, …) + fakeredis, so the worker route and
          # registry tests under tests/ actually run here instead of erroring or
          # skipping on a missing import.
          pip install -r apps/worker/requirements-dev.txt

      - name: Audit dependencies (pip-audit)
        run: |
          pip install pip-audit
          # Scoped to our declared requirements — an env scan would also flag the
          # runner's system pip/setuptools/wheel, which we don't control. Fails on
          # any known advisory; allowlist a specific one with --ignore-vuln <ID>.
          pip-audit -r requirements.txt -r apps/worker/requirements.txt

      - name: Lint (ruff)
        # Correctness rules only — see pyproject.toml. This exists because
        # pyflakes' F821 caught a refactor that left the tail of a method
        # unreachable after a `return`, silently dropping four elements from
        # every counseling record while the whole suite stayed green.
        run: |
          pip install ruff
          ruff check .

      - name: Verify schemas resolve without SCHEMAS_DIR
        # The worker's default used to resolve to a nonexistent directory in both
        # the repo and Docker layouts, which made XSD validation silently no-op.
        # Every other test monkeypatches SCHEMAS_DIR, so this cheap unpatched
        # check is what keeps the default honest.
        run: |
          env -u SCHEMAS_DIR python -c "import sys; sys.path.insert(0, 'apps/worker'); \
            import os; from app.services.conversion_service import SCHEMAS_DIR; \
            assert os.path.isdir(SCHEMAS_DIR), SCHEMAS_DIR; \
            print('schemas resolved to', os.path.realpath(SCHEMAS_DIR))"

      - name: Run tests
        # Coverage gate (QUAL-2): measure src/ + the worker app and fail under
        # the current baseline (~71%) so coverage can't regress. Raise the floor
        # as coverage improves.
        run: python -m pytest tests/ -v --cov=src --cov=apps/worker/app --cov-report=term-missing --cov-report=xml --cov-fail-under=70

  web-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (npm)
        # Blocks on high+ advisories; moderates are reported but don't fail CI.
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker-build:
    # Nothing in CI built or ran either image, which is how three separate
    # deployment defects survived: a compose build context that couldn't resolve,
    # a healthcheck calling a binary the image doesn't ship, and a failed
    # migration that still started the server. `build` alone catches only the
    # first -- `up --wait` is what exercises the other two.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Provide env file
        # web, worker and db all declare `env_file: .env`; compose errors out if
        # it's missing. The example values are fine for a throwaway stack.
        run: cp .env.example .env

      - name: Build images
        run: docker compose build

      - name: Start stack and wait for healthy
        run: docker compose up -d --wait

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
