services:
  web:
    # Repo-root context, matching the worker below and Railway. apps/web/Dockerfile
    # does `COPY apps/web/...`, so a ./apps/web context resolved those to
    # apps/web/apps/web/... and the build failed on the first COPY.
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["3000:3000"]
    env_file: .env
    environment:
      - WORKER_URL=http://worker:8000
      - NEXTAUTH_URL=http://localhost:3000
    volumes:
      - shared-data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    ports: ["8000:8000"]
    env_file: .env
    environment:
      - DATA_DIR=/data
      - SCHEMAS_DIR=/app/schemas
    volumes:
      - shared-data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # stdlib, not curl: python:3.12-slim ships no curl, so the previous probe
      # failed with "executable file not found" on every attempt and the worker
      # was permanently unhealthy. Checks the body rather than the status code
      # because /health returns 200 even when degraded.
      test: ["CMD", "python", "-c", "import urllib.request,json,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://localhost:8000/health',timeout=3))['status']=='ok' else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  shared-data:
  pgdata:
